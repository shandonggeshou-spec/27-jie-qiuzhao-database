<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>27届秋招信息汇总 · 我的备战中心</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="logo">🎯</span>
        <div>
          <h1>27届秋招备战中心</h1>
          <p class="subtitle">互联网 · 产品 / 产运 / 商分 / 战略 / 数分</p>
        </div>
      </div>
      <div class="header-stats" id="headerStats"><!-- JS 填充 --></div>
    </div>
  </header>

  <nav class="tabs wrap">
    <button class="tab active" data-tab="overview">📊 概览</button>
    <button class="tab" data-tab="companies">🏢 公司机会</button>
    <button class="tab" data-tab="prep">📚 准备方向</button>
    <button class="tab" data-tab="progress">✅ 我的进度</button>
  </nav>

  <main class="wrap">
    <!-- 概览 -->
    <section id="overview" class="panel active">
      <h2 class="section-title">秋招时间线</h2>
      <p class="section-hint">27届毕业 → 秋招主战场在 2026 下半年。抓住提前批！</p>
      <div class="timeline" id="timeline"></div>

      <h2 class="section-title" style="margin-top:40px">机会分布</h2>
      <div class="overview-cards" id="overviewCards"></div>
    </section>

    <!-- 公司机会 -->
    <section id="companies" class="panel">
      <div class="notice">
        💡 卡片里的时间/渠道为参考信息，<b>实时状态请点各公司的「🔗 官方校招」按钮</b>（最权威），或看「💬 牛客开奖」了解进度与面经。
      </div>
      <div class="filter-bar">
        <div class="filter-group" id="roleFilter"></div>
        <div class="filter-group" id="tierFilter"></div>
      </div>
      <div class="company-grid" id="companyGrid"></div>
    </section>

    <!-- 准备方向 -->
    <section id="prep" class="panel">
      <div class="prep-nav" id="prepNav"></div>
      <div class="prep-content" id="prepContent"></div>
    </section>

    <!-- 我的进度 -->
    <section id="progress" class="panel">
      <h2 class="section-title">备战清单</h2>
      <p class="section-hint">勾选进度会自动保存在本浏览器（localStorage），换设备不同步。</p>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
      <div class="checklist" id="checklist"></div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p>数据维护：直接编辑 <code>data.js</code> 即可。祝早日上岸 🚀</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
